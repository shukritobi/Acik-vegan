<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123d2a" />
  <title>Status Pembayaran | Acik Vegan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f7f2e5;color:#173126;font-family:"DM Sans",sans-serif}.card{width:min(590px,100%);background:#fffdf7;border:1px solid rgba(23,49,38,.12);border-radius:30px;padding:42px;box-shadow:0 30px 90px rgba(18,61,42,.14);text-align:center}.mark{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;margin:0 auto 24px;background:#dbe99a;color:#123d2a;font-size:34px}h1{font-family:"Fraunces",serif;font-size:46px;line-height:1;margin:0;letter-spacing:-.04em}p{color:#67766d;line-height:1.7}.status{margin:28px 0;padding:18px;border-radius:18px;background:rgba(219,233,154,.25);font-weight:700}.btn{display:inline-block;margin-top:8px;padding:14px 22px;border-radius:999px;background:#123d2a;color:white;text-decoration:none;font-weight:700}.small{font-size:11px;margin-top:24px}@media(max-width:520px){.card{padding:30px 20px}h1{font-size:38px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" id="mark">…</div>
    <h1 id="title">Menyemak pembayaran</h1>
    <p id="message">Sila tunggu sebentar sementara kami menyemak status bil anda.</p>
    <div class="status" id="status">Memproses…</div>
    <a class="btn" href="./">Kembali ke kedai</a>
    <p class="small">Jangan hantar bayaran kedua sekiranya wang sudah ditolak. Hubungi Acik Vegan dengan rujukan bil anda jika status belum berubah.</p>
  </main>
  <script>
    // Set this after deploying payment-worker.js, for example:
    // const PAYMENT_API_BASE = "https://acik-vegan-payment.your-account.workers.dev";
    const PAYMENT_API_BASE = "";

    const params = new URLSearchParams(location.search);
    const billId = params.get("billplz[id]") || params.get("id") || "";
    const mark = document.getElementById("mark");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    const statusBox = document.getElementById("status");

    async function checkStatus() {
      if (!billId || !PAYMENT_API_BASE) {
        mark.textContent = "i";
        title.textContent = "Pembayaran diterima untuk semakan";
        message.textContent = "Halaman ini masih dalam mod prototaip. Integrasi merchant perlu diaktifkan sebelum status pembayaran boleh disahkan secara automatik.";
        statusBox.textContent = billId ? `ID bil: ${billId}` : "Tiada ID bil diterima";
        return;
      }

      try {
        const response = await fetch(`${PAYMENT_API_BASE.replace(/\/$/, "")}/api/order/${encodeURIComponent(billId)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Status tidak tersedia");

        if (data.status === "paid") {
          mark.textContent = "✓";
          title.textContent = "Pembayaran berjaya";
          message.textContent = "Terima kasih. Pesanan anda telah diterima dan akan diproses oleh Acik Vegan.";
          statusBox.textContent = `${data.reference} · RM${(data.amountCents / 100).toFixed(2)}`;
          localStorage.removeItem("acikVeganCart");
          localStorage.removeItem("acikVeganPendingOrder");
        } else {
          mark.textContent = "⌛";
          title.textContent = "Pembayaran belum disahkan";
          message.textContent = "Bil masih belum menunjukkan status berbayar. Status mungkin mengambil sedikit masa untuk dikemas kini.";
          statusBox.textContent = `${data.reference} · Status: ${data.status}`;
        }
      } catch (error) {
        mark.textContent = "!";
        title.textContent = "Status tidak dapat disemak";
        message.textContent = "Simpan ID bil ini dan cuba lagi sebentar lagi.";
        statusBox.textContent = billId;
      }
    }

    checkStatus();
  </script>
</body>
</html>
